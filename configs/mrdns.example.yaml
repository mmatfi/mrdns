# mrdns configuration. Installed at /opt/mrdns/etc/mrdns.yaml
#
# Zones and records live in the SQLite database (data_dir/mrdns.db) and are
# managed entirely in the web UI — they are NOT configured here.

listen: "127.0.0.1:8080"        # bind locally; put behind a TLS reverse proxy
secure_cookies: false           # set true once the UI is served over HTTPS

data_dir: /opt/mrdns/var        # holds mrdns.db
audit_log: /opt/mrdns/var/log/audit.jsonl

# Secrets are read from the environment (see deploy/mrdns.env.example).
auth_token_env: MRDNS_TOKEN
cookie_key_env: MRDNS_COOKIE_KEY

serial_policy: date             # date (YYYYMMDDnn) | unixtime | increment
backup_keep: 20                 # deploy snapshots retained per zone

# Target BIND nameservers reached over SSH. The deploy user needs write access
# to remote_zone_dir and a scoped sudo rule for rndc (deploy/sudoers.example).
# {zone} is substituted in reload_cmd. The remote zone file is "<zone>.zone" in
# remote_zone_dir — point each server's named.conf at that path.
servers:
  ns1:
    host: ns1.example.net
    port: 22
    user: mrdns-deploy
    ssh_key: /opt/mrdns/etc/id_ed25519
    known_hosts: /opt/mrdns/etc/known_hosts
    remote_zone_dir: /etc/bind/zones
    checkzone_cmd: /usr/sbin/named-checkzone
    reload_cmd: "sudo /usr/sbin/rndc reload {zone}"
  ns2:
    host: ns2.example.net
    user: mrdns-deploy
    ssh_key: /opt/mrdns/etc/id_ed25519
    known_hosts: /opt/mrdns/etc/known_hosts
    remote_zone_dir: /etc/bind/zones
    reload_cmd: "sudo /usr/sbin/rndc reload {zone}"
