# Local development config. State (mrdns.db, audit log) is written under ./.dev
# (git-ignored). Run with: make run
# Create zones in the UI — there are none to configure here.
listen: "127.0.0.1:8080"
secure_cookies: false
data_dir: ./.dev
audit_log: ./.dev/log/audit.jsonl
serial_policy: date
backup_keep: 10

servers:
  local:
    host: 127.0.0.1
    port: 2222
    user: mrdns-deploy
    ssh_key: ./.dev/id_ed25519
    known_hosts: ./.dev/known_hosts
    remote_zone_dir: /etc/bind/zones
    checkzone_cmd: /usr/sbin/named-checkzone
    reload_cmd: "sudo /usr/sbin/rndc reload {zone}"
