# Local development config. State is written under ./.dev (git-ignored).
# Run with: make run   (or see the MRDNS_TOKEN / MRDNS_COOKIE_KEY env vars).
listen: "127.0.0.1:8080"
secure_cookies: false
zones_dir: ./.dev/var
audit_log: ./.dev/var/log/audit.jsonl
serial_policy: date
backup_keep: 10

servers:
  local:
    host: 127.0.0.1
    port: 2222
    user: mrdns-deploy
    ssh_key: ./.dev/id_ed25519
    known_hosts: ./.dev/known_hosts
    remote_zone_dir: /etc/bind/zones
    checkzone_cmd: /usr/sbin/named-checkzone
    reload_cmd: "sudo /usr/sbin/rndc reload {zone}"

zones:
  example.com:
    file: example.com.zone
    targets: [local]
