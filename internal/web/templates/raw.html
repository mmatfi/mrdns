{{template "head" .}}
<p class="crumb"><a href="/zones/{{.Zone}}">{{template "ic_back" .}} {{.Zone}}</a></p>
<h1>Raw edit — {{.Zone}}</h1>
<p class="muted">Advanced — edit the whole zone file. Normal edits are easier in the record table.</p>
{{if .Err}}<div class="opbox bad">{{.Err}}</div>{{end}}
<form action="/zones/{{.Zone}}/raw" method="post">
  <input type="hidden" name="csrf_token" value="{{.CSRF}}">
  <textarea name="content" rows="22" spellcheck="false">{{.Content}}</textarea>
  <div class="actions">
    <button class="btn primary">{{template "ic_check" .}} <span>Save draft</span></button>
    <a class="btn ghost" href="/zones/{{.Zone}}">Cancel</a>
  </div>
</form>
{{template "foot" .}}
