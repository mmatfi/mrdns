{{define "records"}}
<div id="records">
  {{if .RecErr}}<div class="opbox bad">{{.RecErr}}</div>{{end}}
  <table class="grid">
    <thead><tr><th>Name</th><th>TTL</th><th>Type</th><th>Data</th><th></th></tr></thead>
    <tbody>
    {{range .Records}}
      {{if .Editing}}
      <tr class="editing">
        <td><input name="name" value="{{.Name}}" aria-label="name"></td>
        <td><input name="ttl" value="{{.TTL}}" size="6" aria-label="TTL"></td>
        <td><input name="type" value="{{.Type}}" size="7" list="rtypes" aria-label="type"></td>
        <td><input name="data" value="{{.Data}}" aria-label="data"></td>
        <td class="rowactions">
          <input type="hidden" name="id" value="{{.ID}}">
          <button type="button" class="link" hx-post="/zones/{{$.Zone}}/records/update" hx-include="closest tr" hx-target="#records" hx-swap="outerHTML">{{template "ic_check" $}} save</button>
          <button type="button" class="link" hx-get="/zones/{{$.Zone}}/records" hx-target="#records" hx-swap="outerHTML">cancel</button>
        </td>
      </tr>
      {{else}}
      <tr>
        <td>{{.Name}}</td>
        <td class="muted">{{.TTL}}</td>
        <td><span class="type type-{{.Type}}">{{.Type}}</span></td>
        <td><code>{{.Data}}</code></td>
        <td class="rowactions">
          <input type="hidden" name="id" value="{{.ID}}">
          <button type="button" class="link" hx-get="/zones/{{$.Zone}}/records/edit?id={{.ID}}" hx-target="#records" hx-swap="outerHTML">{{template "ic_edit" $}} edit</button>
          <button type="button" class="link danger" hx-post="/zones/{{$.Zone}}/records/delete" hx-include="closest tr" hx-target="#records" hx-swap="outerHTML" aria-label="delete">{{template "ic_trash" $}}</button>
        </td>
      </tr>
      {{end}}
    {{end}}
    </tbody>
  </table>

  <form class="addrow" hx-post="/zones/{{.Zone}}/records" hx-target="#records" hx-swap="outerHTML">
    <input name="name" placeholder="name (www or @)" required>
    <input name="ttl" value="3600" size="6" aria-label="TTL">
    <input name="type" placeholder="type" list="rtypes" size="7" required>
    <input name="data" placeholder="data (e.g. 192.0.2.10)" required>
    <button type="submit" class="btn primary">{{template "ic_plus" .}} <span>Add</span></button>
  </form>
  <datalist id="rtypes">
    <option>A</option><option>AAAA</option><option>CNAME</option><option>MX</option>
    <option>TXT</option><option>NS</option><option>SRV</option><option>PTR</option><option>CAA</option>
  </datalist>
</div>
{{end}}

{{define "validate_result"}}
<div class="opbox {{if .OK}}ok{{else}}bad{{end}}">
  {{if .OK}}<strong>Valid.</strong> {{.Msg}}{{else}}<strong>Invalid.</strong>{{end}}
  {{if .Detail}}<pre>{{.Detail}}</pre>{{end}}
</div>
{{end}}
