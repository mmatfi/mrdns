{{define "head"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · mrdns</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body{{if .Authed}} hx-headers='{"X-CSRF-Token": "{{.CSRF}}"}'{{end}}>
<header class="topbar">
  <a class="brand" href="/">mrdns</a>
  <nav class="nav">{{if .Authed}}<a href="/">Zones</a><a href="/servers">Servers</a>{{end}}</nav>
  {{if .Authed}}
  <form method="post" action="/logout" class="logout">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <button type="submit">Log out</button>
  </form>
  {{end}}
</header>
<main class="container">
{{end}}

{{define "foot"}}
</main>
<footer class="foot">mrdns — DNS zone editor &amp; deployer</footer>
</body>
</html>
{{end}}
